<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Site</title>
</head>
<body>
    <h1>This is for testing</h1>
<form action="/testing" method="post">
    <label for="hazard">Hazard:</label>
    <input type="number" id="hazard" name="hazard" step="1" min="0" max="10" required>

    <label for="extent">Extent:</label>
    <input type="number" id="extent" name="extent" step="1" min="0" max="10" required>

    <label for="escalation">Escalation:</label>
    <input type="number" id="escalation" name="escalation" step="1" min="0" max="10" required>

    <label for="exposure">Exposure:</label>
    <input type="number" id="exposure" name="exposure" step="1" min="0" max="10" required>

    <button type="submit">Calculate Priority</button>
</form>
</body>
</html>
